<div class="api-standared">
  <p-toast />
  <p-confirmDialog />
  <div class="api-standared_header">
    <h3>Standards</h3>
    <stc-apps-button
      [buttonText]="'Add Standard'"
      [buttonType]="'primary'"
      [buttonIcon]="'fa-plus'"
      (click)="onAddStandard()"
    ></stc-apps-button>
  </div>
  <div class="api-standard_filters">
    <stc-apps-api-standard-filters
      (filtersChanged)="onFiltersChanged($event)"
      (sortChanged)="onSortChanged($event)"
      [businessAreaOptions]="businessAreaOptions"
    ></stc-apps-api-standard-filters>
  </div>

  <div class="api-standared_table">
    <stc-apps-table-list
      [dataSource]="standards"
      [columnSchema]="columnsSchema"
      [tableActions]="tableActions()"
      [noDataMessage]="'No API standards available'"
      (actionClick)="onActionHandler($event)"
    >
      <ng-template #publishUpdateTemplate let-row>
        {{ row.publishUpdate | date : "dd MMM yyyy 'at' hh:mm a" }}
      </ng-template>
    </stc-apps-table-list>
  </div>
</div>
