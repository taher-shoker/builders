<section class="scored-card-section">
    <div class="scored-card-section-header">
      <div>
        <stc-apps-page-header
          [mainTitle]="'PSR'"
          [secondaryTitle]="''"
        />
      </div>
      <img class = "hands-img" src="assets/images/hands-img.svg" alt="">
    </div>
      <div class="scored-card-section-tap-details">
        @if(currentMode === 'editMode') {
          <stc-apps-edit-mode-view 
            (import)="showDialog()"
            (export)="downloadTemplate()"
          />
        }
        @if(!isEmpty)
        {
          <div class="projects-container">
            <p class = "psr-tabview-header">
              {{PSRDetailsData ? PSRDetailsData[0].title : ''}}
            </p>
            <div class="project-cards-container">
              @for (proj of PSRDetailsData; track $index) {
                <div class="project-card">
                  <stc-apps-project-details-card 
                    [projectData]="proj"
                    (addRecordInTable)="addRecordInTable($event)"
                    (closePopupEmit)="closePopup($event)"
                    [userRoles]="userRoles"
                  />
                </div>
              }
            </div>
          </div>
        } @else {
          <p class = "empty-data-msg">
            there are no data for this project
          </p>
        }
      </div>
  </section>
<stc-apps-dialog-modal 
  [visible]="visible"
  (ImportedFile)="importData($event)"
  (onhide)="onHide()"
/>
