<section class="psr-tabview">
    @if(currentMode === 'editMode') {
        <stc-apps-edit-mode-view 
          (import)="showDialog()"
          (export)="downloadTemplate()"
        />
    } 
    <p class = "psr-tabview-header">
        data governance strategic projects execution (execution view)
    </p>
    <div class="project-container">
        @for (project of projects(); track project.id) {
            <div class="project-container-card">
                <stc-apps-psr-project-card 
                    [project]="project"
                />
            </div>
        }
    </div>
</section>
<stc-apps-dialog-modal 
  [visible]="visible"
  (ImportedFile)="importData($event)"
  (onhide)="onHide()"
/>
