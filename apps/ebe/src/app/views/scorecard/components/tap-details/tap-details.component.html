<section class="financial-scorecard">
  @if(currentMode() === 'editMode') {
  <div class="financial-scorecard-edit-mode">
    <!-- <input type="file" hidden #uploader (change)="getUploadedFile($event)" /> -->
    <button
      class="financial-scorecard-edit-mode-button import-btn"
      (click)="showDialog()"
    >
      <!-- (click)="uploader.click()" -->
      <img src="assets/images/upload-solid.svg" />
      <span>import</span>
    </button>
    <button class="financial-scorecard-edit-mode-button">
      <img src="assets/images/download-solid.svg" />
      <span>export</span>
    </button>
    <!-- {{currentClickedTap().name}} -->
  </div>
  } 
  <form
  class="financial-scorecard-header-dropdowns justify-content-end"
  [formGroup]="filtersForm"
  >
    <stc-apps-select-drop-down
      [label]="''"
      formControlName="month"
      [options]="monthsArr"
      [outputValue]="'id'"
      (selectChange)="selectMonth()"
    />
    <stc-apps-select-drop-down
      [label]="''"
      formControlName="year"
      [options]="years()"
      [outputValue]="'id'"
      (selectChange)="selectYear()"
    />
  </form>
  @if(!isEmpty())
  {
    @for (scorecard of scorcardData(); track $index;let first =
    $first) {
    <div class="financial-scorecard-header">
      <p class="financial-scorecard-header-title" [class.mt-4]="!first">
        {{ scorecard.title }}
      </p>
    </div>
    <div class="financial-scorecard-costs">
      <div class="row">
        @for (kpi of scorecard.kpiDataDTO; track $index) {
          <div class="col-lg-6 col-md-6 col-sm-12 mt-4">
            <stc-apps-kpi-card [kpi]="kpi" />
          </div>
        }
      </div>
    </div>
    }
  } @else {
    <h4 class = "empty-data-msg mt-4">There are no KPIs</h4>
  }
</section>
<p-dialog
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '30rem' }"
  [draggable]="false"
  [dismissableMask]="true"
  (onHide)="hideDialog()"
  (onShow)="showDialog2()"
>
  <ng-template pTemplate="header">
    <div class="modal-header">
      upload file
    </div>
  </ng-template>
  <stc-apps-file-upload-input 
    [isHidden]="isHidden"
    (uploadedFile)="getUploadedFile($event)"
  />
  <ng-template pTemplate="footer">
    <footer>
      <button 
        class = "import-data-btn" 
        (click)="importData()"
        [disabled]="!selectedFile"
        [class.disabled-btn]="!selectedFile"
      >import</button>
      <button class = "cancel-btn" (click)="visible = false;">cancel</button>
    </footer>
  </ng-template>
</p-dialog>
