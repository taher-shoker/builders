<section class="financial-scorecard">
  <p class = 'financial-scorecard-title'>{{financialScorcardData.title}}</p>
  <div class="financial-scorecard-costs">
    <div class="row">
      @for (cost of financialScorcardData.costsData; track cost.id) {
        <div class="col-lg-6 col-md-6 col-sm-12 mt-4">
          <stc-apps-cost-card
            [costData]="cost"
          />
        </div>
      }
    </div>
  </div>
</section>
