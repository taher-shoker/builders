<div class="user-form">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="inputs">
      <div class="row">
        <div class="col-md-6">
          <stc-apps-input
            [className]="'custom-input'"
            [inputPlaceholder]="'Example@STC.COM'"
            [inputId]="'email'"
            [inputName]="'email'"
            formControlName="email"
          ></stc-apps-input>
        </div>
        <div class="col-md-6">
          <stc-apps-input
            [className]="'custom-input'"
            [inputPlaceholder]="'EX: Developer'"
            [inputId]="'jobtitle'"
            [inputName]="'job title'"
            formControlName="jobtitle"
          ></stc-apps-input>
        </div>
      </div>
      <div class="row mt-7">
        <div class="col-md-6">
          <stc-apps-select-drop-down
            [label]="'Privilage'"
            [options]="privilages"
            formControlName="privilege"
            [required]="false"
          ></stc-apps-select-drop-down>
        </div>
        <div class="col-md-6">
          <stc-apps-select-drop-down
            [label]="'Team'"
            [options]="teams"
            formControlName="team"
          ></stc-apps-select-drop-down>
        </div>
      </div>
    </div>
    <div class="btn-form-action">
      <stc-apps-button
        [buttonText]="'cancel'"
        [buttonType]="'gray-outline'"
      ></stc-apps-button>

      <div class="mx-3"></div>
      <stc-apps-button
        *ngIf="!isEditing"
        [buttonText]="'Add user'"
        [buttonType]="'warn'"
        (btnClick)="onSubmit()"
      ></stc-apps-button>
      <stc-apps-button
        *ngIf="isEditing"
        [buttonText]="'save'"
        [buttonType]="'warn'"
      ></stc-apps-button>
    </div>
  </form>
</div>
