      <div class="offset-10 col-md-2">

  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ userService.translateText(col.label)}}
      </th>
      <td mat-cell *matCellDef="let element">
        <div [ngSwitch]="col.type">
          <div class="info-name" *ngSwitchCase="'date'">
            <span class="cell-text">
              {{ element[col.key] | date }}
            </span>
          </div>
          <span class="cell-text" *ngSwitchCase="''">
            <span class="status" [ngClass]="element[col.key].toLowerCase()">
              {{ element[col.key] }}
            </span>
          </span>

          <span class="cell-text" *ngSwitchDefault>
            {{ element[col.key] }}
          </span>
        </div>
      </td>
    </ng-container>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        <div class="message-box">
          <img src="../../assets/Group 590.png" alt="" />
          <h3>{{ 'No Files yet' }}</h3>
          <p>{{ 'You didn&lsquo;t add any file yet, let&lsquo;s add File' }}</p>
          <stc-apps-button [buttonText]="'Upload A file'" [buttonType]="'primary'" [buttonIcon]="' fa-plus-circle'"
            (btnClick)="dialogService.open('add-modal')"></stc-apps-button>
        </div>
      </td>
    </tr>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15, 20]" [showFirstLastButtons]="true" [hidePageSize]="true">
  </mat-paginator>
</div>
<stc-apps-data-upload-modal (callList)="getDataListing()"></stc-apps-data-upload-modal>
