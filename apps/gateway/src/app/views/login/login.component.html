<div class="login">
  <div class="shape4"></div>
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-md-5   ">


        <div class="card">
          <div class="shape1"></div>
          <div class="shape2"></div>
          <div class="shape3"></div>

          <div class="card-img">
            <img src="assets/images/login/stc.png" alt="stc" />
          </div>
          <h4 class="">{{ 'login_with_email' | translate }}</h4>
          <p>Welcome back , let’s discover the applications</p>
          <div class="card-body">

          </div>
        </div>
      </div>
      <div class="col-md-7  ">
        <div class="row">
          <div class="col-md-6 offset-md-3">
            <form [formGroup]="form">
              <div class="mb-2">
                <stc-apps-input [inputName]="'email'" [className]="'stc-input outline-input'"
                  [inputPlaceholder]="'Enter your email'" [inputId]="'email'" formControlName="email"
                  [inputIcon]="'fa-user'"></stc-apps-input>
              </div>
              <div class="mb-2">
                <stc-apps-input [inputType]="'password'" [inputId]="'password'" [inputName]="'Password'"
                  [className]="'stc-input outline-input'" [inputPlaceholder]="'Enter password'" [inputId]="'password'"
                  formControlName="password" [inputIcon]="'fa-lock'"></stc-apps-input>
              </div>

              <stc-apps-button [buttonText]="'login' | translate" [buttonType]="'primary'" [buttonDisable]="false"
                (btnClick)="onSubmit()"></stc-apps-button>
            </form>
            <span class="divider-line my-4">{{ 'or' | translate }}</span>
            <stc-apps-button [buttonType]="'stc-color-outline'" [buttonText]="'login_with_stc' | translate"
              [buttonDisable]="false"></stc-apps-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
