<div class="dashboard">
  <div class="top-info">
    <div class="row">
      <div class="col-md-4">
        <div class="static register">
          <div class="icon">
            <i class="fas fa-user-friends"></i>
          </div>
          <div class="static-info">
            <div class="num">{{ 55 }}</div>
            <div class="title">{{ 'total_users' | translate }}</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="static in-progress">
          <div class="icon">
            <i class="fas fa-user-edit"></i>
          </div>
          <div class="static-info">
            <div class="num">{{ 55 }}</div>
            <div class="title">{{ 'creator_users' | translate }}</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="static pending">
          <div class="icon">
            <i class="fas fa-user-check"></i>
          </div>
          <div class="static-info">
            <div class="num">{{ 55 }}</div>
            <div class="title">{{ 'approver_users' | translate }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class = 'chart-box'>
          <h4>{{registeredCasesChart.title}}</h4>
          <div class="chart" style = 'height:400px;'>
            <stc-apps-line-chart
              [chartData]="registeredCasesChart.chartData"
              [colors]="registeredCasesChart.lineChartColors"
            ></stc-apps-line-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class = 'chart-box bar-chart'>
          <h4>{{productivityTeamUsers.title}}</h4>
          <div class="chart" style = 'height:400px;'>
            <stc-apps-bar-chart
              [data]="productivityTeamUsers.chartData"
              [colors]="productivityTeamUsers.barChartColors"
            ></stc-apps-bar-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class = 'chart-box bar-chart'>
          <h4>{{casesTypes.title}}</h4>
          <div class="chart" style = 'height:700px;'>
            <stc-apps-progress-circle-chart
              [data]="casesTypes.chartData"
              [colors]="casesTypes.chartColors"
              [totalCases]="casesTypes.totalCases"
            ></stc-apps-progress-circle-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class = 'chart-box bar-chart mb-0'>
          <h4>{{stages.title}}</h4>
          <div class="chart" style = 'height:400px;'>
            <stc-apps-bar-chart
              [data]="stages.chartData"
              [colors]="stages.barChartColors"
            ></stc-apps-bar-chart>
          </div>
        </div>
      </div>
    </div>
    <!-- <div class="row">
      <div class="col">
        <stc-apps-progress-circle-chart [data]="progressCircleData" [title]="'Chart to compare the cases to each other with case type'"></stc-apps-progress-circle-chart>
      </div>
    </div>
  </div>-->
</div>
