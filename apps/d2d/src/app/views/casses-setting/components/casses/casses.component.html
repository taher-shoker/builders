<div class="users-settings">
  <div class="top-info"></div>
  <stc-apps-filter-box
    [addNavigate]="addCasseNavigate"
    [addBtnLabel]="addNewCasseLabel"
  ></stc-apps-filter-box>
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
      <th mat-header-cell *matHeaderCellDef>
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element">
        <div [ngSwitch]="col.key">
          <div class="info-name" *ngSwitchCase="'name'">
            <div class="name">
              <h4>{{ element[col.key] }}</h4>
              <small>ID: {{ element.id }}</small>
            </div>
          </div>
          <div class="btns-action" *ngSwitchCase="'actions'">
            <button
              mat-button
              class="btn details"
              (click)="detailsNavigate(element.id)"
            >
              Show details
            </button>
          </div>
          <span class="cell-text" *ngSwitchDefault>
            {{ element[col.key] }}
          </span>
        </div>
      </td>
    </ng-container>
