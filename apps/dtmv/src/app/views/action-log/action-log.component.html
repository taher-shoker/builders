<!-- <stc-apps-breadcrumb [bgColor]="'primary'"></stc-apps-breadcrumb> -->
<stc-apps-banner [pageTitle]="'Action Log'"></stc-apps-banner>

<div class="layout">
  <div class="box">
    <div class="action-log">
  <form [formGroup]="form" class="filter-bar">
    <div class="row">
      <div class="col-md-4">
        <stc-apps-select-drop-down
          [label]="'User'"
          [options]="userOptions"
          [labelName]="'name'"
          [outputValue]="'email'"
          [searchMode]="true"
          [Resetting]="true"
          [resetTrigger]="dropdownResetKey"
          formControlName="user"
          [group]="false"
        ></stc-apps-select-drop-down>
      </div>
      <div class="col-md-4">
        <stc-apps-select-drop-down
          [label]="'Action Type'"
          [options]="actionTypeOptions"
          [labelName]="'name'"
          [outputValue]="'name'"
          [searchMode]="true"
          [Resetting]="true"
          [resetTrigger]="dropdownResetKey"
          formControlName="actionType"
          [group]="false"
        ></stc-apps-select-drop-down>
      </div>
      <div class="col-md-4">
        <stc-apps-input
          [className]="'custom-input'"
          [inputName]="'Milestone Name'"
          formControlName="milestoneName"
        ></stc-apps-input>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-12 d-flex justify-content-end">
        <stc-apps-button
          [buttonText]="'Clear Filters'"
          [buttonType]="'gray-outline'"
          (btnClick)="clearFilters()"
          [buttonIcon]="'fa-times'"
          [loading]="loadingClearFilters"
          [buttonDisable]="!hasActiveFilters()"
        ></stc-apps-button>
        <div class="mx-3"></div>
        <stc-apps-button
          [buttonText]="'Apply Filters'"
          [buttonType]="'primary'"
          (btnClick)="handleFilterChange()"
          [buttonIcon]="'fa-search'"
          [loading]="loadingApplyFilters"
          [buttonDisable]="!hasActiveFilters()"
        ></stc-apps-button>
        <div class="mx-3"></div>
        <stc-apps-button
          [buttonText]="'Export'"
          [buttonType]="'warn'"
          (btnClick)="export()"
          [buttonIcon]="'fa-download'"
          [loading]="loadingExport"
          [buttonDisable]="!hasActiveFilters() && actions.length === 0"
        ></stc-apps-button>
      </div>
    </div>
  </form>

  <div class="table-holder mt-4">
    <div class="table-overlay" *ngIf="loadingTable">
      <div class="spinner"></div>
    </div>

    <!-- Empty state message when no data -->
    <div *ngIf="!loadingTable && actions.length === 0" class="empty-state">
      <div class="empty-state-icon">
        <i class="fas fa-inbox"></i>
      </div>
      <div class="empty-state-title">No Action Log Data</div>
      <div class="empty-state-message">
        No action log entries found. Try adjusting your filters or check back later.
      </div>
    </div>
  <!-- [rowClickEnabled]="true"
      [rowClickAction]="'details'" -->
    <!-- Table when data is available -->
    <stc-apps-custom-table
      *ngIf="actions.length > 0"
      [headers]="$any(columnsSchema)"
      [items]="actions"
      [length]="totalCount"
      [sort]="false"
      [paginate]="true"
      [applyFilter]="false"

      [currentPage]="currentPage"
      [paginationConfig]="{
        pageCount: pageSize,
        pageSizesOptionals: [
          { name: '10', id: '10' },
          { name: '20', id: '20' },
          { name: '50', id: '50' },
          { name: '100', id: '100' }
        ],
        showTotal: true,
        paginationIq: 'smart',
        showPagePerItems: true,
        currentPage: currentPage
      }"
      (paginationEvent)="paginate($event)"
      (pageSizeEvent)="setPageItemsCount($event)"
      (doAction)="onAction($event)"
    ></stc-apps-custom-table>
  </div>
    </div>
  </div>
</div>
