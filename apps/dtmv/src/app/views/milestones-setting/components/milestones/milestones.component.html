<div class="casses-settings">

  <div class="row mt-4">
    <div class="col-md-8">
      <div class="f-box">
        <div class="row align-items-center">
          <div class="col-md-3">
            <p class="table-title">{{ 'milestones_list' | translate }}</p>
          </div>
          <div class="col-md-9">
            <div class="row">
              <div class="col">
                <div class="input-group stc-input-group custom-input mb-3">
                  <span class="input-group-text" id="basic-addon1"><i class="fas fa-search"></i></span>
                  <input type="text" matInput #input placeholder="{{ 'Search for Case Serial' | translate }}"
                    class="form-control stc-input" (keyup)="searchFilter($event)" />
                </div>
              </div>

              <div class="col-3">
                <stc-apps-button [buttonText]="'filter' | translate" [buttonType]="'gray-outline'"
                  [buttonIcon]="'fa-filter'" (btnClick)="toggleFilter()"></stc-apps-button>
              </div>

              <ng-container *ngIf="authService.getLoggedInUser()">
                <div class="col-md-4" *ngIf="
                    authService.getLoggedInUser().roles.includes('CREATORS')
                  ">
                  <stc-apps-button [buttonText]="'Add new Case' | translate" [buttonType]="'primary'"
                    [buttonIcon]="' fa-plus-circle'" (btnClick)="addCasseNavigate()"></stc-apps-button>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>

      <stc-apps-custom-table [data]="tableData" [columnsSchema]="columnsSchema"
        [pagesFetchedIndexes]="pagesFetchedIndexes" [pagesCount]="milestonesPagesCount"
        (pageIndexChange)="onPageIndexChange($event)" (doAction)="tableAction($event)"></stc-apps-custom-table>
    </div>
    <div class="col-md-4">
      <stc-apps-items-list [caption]="'pending_actions' |translate" [items]="allItems"></stc-apps-items-list>
    </div>
  </div>
</div>

<stc-apps-dialog id="filter-Modal">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" (blur)="(OnChangesForm)" class="p-3 pb-0">
    <div class="inputs">
      <div class="row">
        <div class="col-md-3">
          <stc-apps-input [className]="'custom-input'" [inputId]="'milestoneName'"
            [inputName]="'milestone_name' | translate" formControlName="milestoneName"></stc-apps-input>
        </div>
        <div class="col-md-3">
          <stc-apps-input [className]="'custom-input'" [inputId]="'team'" [inputName]="'team' | translate"
            formControlName="team"></stc-apps-input>
        </div>
        <div class="col-md-3">
          <stc-apps-input [className]="'custom-input'" [inputPlaceholder]="''" [inputId]="'status'"
            [inputName]="'status' | translate" formControlName="status"></stc-apps-input>
        </div>
        <div class="col-md-3">
          <stc-apps-input [className]="'custom-input'" [inputPlaceholder]="''" [inputId]="'month'"
            [inputName]="'month' | translate" formControlName="month"></stc-apps-input>
        </div>
        <div class="col-md-3">
          <stc-apps-input [className]="'custom-input'" [inputPlaceholder]="''" [inputId]="'year'"
            [inputName]="'year' | translate" formControlName="year"></stc-apps-input>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 offset-8">
        <div class="btn-form-action d-flex justify-content-end">
          <stc-apps-button [buttonText]="'clear_filter' | translate" [buttonType]="'gray-outline'"
            (btnClick)="clearFormFilter()"></stc-apps-button>

          <div class="mx-3"></div>
          <stc-apps-button [buttonText]="'filter' | translate" [buttonType]="'primary'" [buttonDisable]="disabled"
            (btnClick)="onSubmit()" [actionType]="'submit'"></stc-apps-button>
        </div>
      </div>
    </div>
  </form>
</stc-apps-dialog>

<stc-apps-dialog id="delete-modal">
  <p class="text">
    <span>{{ 'You&lsquo;re about to Remove Milestone , ' }} </span>
    <strong>#{{ rowData?.id }}</strong>


    <span> {{ ' Kindly note you can&lsquo;t roll back this action. Are you sure?' }}</span>
  </p>

  <div class="row mt-4">
    <div class="col-md-4 offset-8">
      <div class="d-flex justify-content-end">
        <stc-apps-button [buttonText]="'cancel'" [buttonType]="'gray-outline'"
          (btnClick)="dialogService.close()"></stc-apps-button>

        <div class="mx-3"></div>
        <!-- <stc-apps-button [buttonText]="'delete user'" [buttonType]="'primary'"
          (btnClick)="confirmDelete()"></stc-apps-button> -->
      </div>
    </div>
  </div>
</stc-apps-dialog>
