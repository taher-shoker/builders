<div class="logs-panel-header">
  <div class="row">
    <div class="col-md-6">
      <div class="logs-panel-header_info row">
        <div class="logs-panel-header_info_type col-md-2">
          <span
            [ngStyle]="{
              'background-color':
                type() === 'FEEDBACK' ? 'var(--stc-color)' : 'var(--red-alet)'
            }"
            >{{ formatType(type()) }}</span
          >
        </div>
        <div class="logs-panel-header_info_data col-md-10">
          <h5 class="tile">{{ title() }}</h5>
          <p class="subTitle">
            {{
              subTitle().length > 50
                ? (subTitle() | slice : 0 : 75) + '...'
                : subTitle()
            }}
          </p>
        </div>
      </div>
    </div>

    <div class="col-md-2 offset-md-1">
      @if(count()>0){
      <div class="logs-panel-header_number-of-attachments">
        <div>
          <i class="icon fa-solid fas fa-paperclip"></i>
          <span class="count">{{ count() }}</span>
        </div>
      </div>
      }
    </div>

    <div class="col-md-3">
      <div class="logs-panel-header_date">
        <div>
          <i class="icon fa-regular fas fa-calendar"></i>
          <span class="date">{{ date() }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
