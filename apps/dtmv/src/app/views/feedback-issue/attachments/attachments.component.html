<div
  class="row file-box"
  [ngClass]="!logs() ? 'scrollable-area' : ''"
  *ngIf="
    files() &&
    files().length > 0 &&
    !errorSize() &&
    !errorType() &&
    !errorMaxNumber()
  "
>
  @for(file of files(); track file){
  <div class="col-md-5">
    <div class="file">
      <div class="w-100 row">
        <div class="col-md-1 d-flex align-items-center">
          <i class="fa-regular fas fa-image"></i>
        </div>
        <div class="col-md-9">
          <span> {{ file.name }}</span>
          <div class="file_size">
            {{ file.size / 1024 | number : '1.0-0' }}KB
          </div>
        </div>
        <div class="col-md-2 d-flex align-items-center justify-content-end">
          @if(logs()){
          <i role="button" class="fa-solid fas fa-download"></i>
          } @else(){
          <i
            role="button"
            class="fa fa-times-circle remove-file"
            (click)="removeFile(file)"
          ></i>
          }
        </div>
      </div>
    </div>
  </div>
  }
</div>
