<stc-apps-header
  [userName]="userName"
  [logoSrc]="logoSrc"
  [allItems]="navItems"
  [sidebarLogoSrc]="sidebarLogoSrc"
  (logOut)="logOut()"
  (backToHome)="backToHome()"
  [showLang]="false"
>
  <stc-apps-notifications-dropdown
    *ngIf="milestonesService.remindersItems.length > 0"
    (clickItem)="clickReminder($event)"
    [items]="milestonesService.remindersItems"
    [notificationsTitle]="'milestones reminders'"
  ></stc-apps-notifications-dropdown
></stc-apps-header>
