<div class="profile-content m-3">
  <div class="row">
    <div [class]="replyClass ? 'offset-2 col-md-6' : 'col-md-8'">
      <div class="profile-content_holder d-flex">
        <img
          [class]="replyClass ? '' : 'profile-content_avatar'"
          class="avatar avatar-16 rounded-circle text-white"
          src="assets/images/avatar.svg"
        />
        <div class="profile-content-info mt-2">
          <div class="profile-content_name">{{ name() }}</div>
          <div
            class="profile-content_desc"
            [innerHTML]="comment().replace(generateRegex(), '<span>$&</span>')"
          ></div>
        </div>
      </div>
    </div>
    @if(time()){
    <div [class]="replyClass ? 'col-md-4' : 'col-md-4'">
      <div class="profile-content_time">{{ time() }}</div>
    </div>
    }
  </div>
  @if(time()){
  <div
    class="d-flex"
    [class]="replyClass ? 'actions-reply-holder' : 'actions-holder'"
  >
    @for(action of actionsList;track $index ){

    <div (click)="actionsClick(action)" class="action-btns">{{ action }}</div>
    }
  </div>
  }
  <hr
    *ngIf="!lastItem()"
    [class]="
      !hasReplies() && !reply()
        ? 'profile-content_line'
        : 'profile-content_line-reply'
    "
  />
</div>
