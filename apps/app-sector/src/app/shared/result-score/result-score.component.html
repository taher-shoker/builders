<div class="score px-3">
  <div class="score_content">
    <div class="score_content_image">
      <img src="assets/images/status-up.svg" />
    </div>

    <div class="score_content_result">
      <h3>{{ title() }}</h3>
      <p>Result</p>
    </div>
  </div>

  <div class="score_chart">
    <h1>{{ percentage() | percent }}</h1>
  </div>
</div>
