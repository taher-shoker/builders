<div class="comments">
  <div class="comments_form">
    <div class="comments_form_content">
      <div
        class="comments_form_editor"
        type="text"
        [attr.data-placeholder]="placeholder()"
        [mentionConfig]="mentionConfig"
        [mentionListTemplate]="mentionListTemplate"
        contenteditable="true"
        (itemSelected)="onItemSelected($event)"
        (change)="change($event)"
        (keyup)="onInput($event)"
      ></div>
      <ng-template #mentionListTemplate let-item="item" let-index="index">
        <!-- <span>{{ item.name }}</span> -->
        <stc-apps-profile
          [name]="item[mentionProperty()]"
          [comment]="item.jobTitle"
          [lastItem]="index === items.length - 1"
        ></stc-apps-profile>
      </ng-template>
    </div>
  </div>
</div>
