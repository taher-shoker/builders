<div
  class="card"
  [ngClass]="title() === 'Formula & Validation Notes' ? 'formula-height' : ''"
>
  <h3 class="card_title">{{ title() }}</h3>
  <div
    class="card_description"
    [ngClass]="checkForPrecentage() ? 'puprleColor' : ''"
  >
    {{ description() === null ? '-' : description() }}
  </div>
</div>
