<div class="comments">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="comments_form">
      <div class="comments_form_header">
        <h3>Add Your Comments</h3>
        <!-- <img src="assets/images/chat.svg" /> -->
      </div>
      <div class="comments_form_content">
        <textarea formControlName="comment" placeholder="Enter Comment Here..." rows="16.5"></textarea>
      </div>
    </div>
    <div class="comments_actions">
      <button [disabled]="form.invalid">Submit</button>
      <button (click)="triggerFileInput()">
        <img src="assets/images/attach-square.svg" />
        Add Attachment
      </button>
    </div>
  
    <input
      type="file"
      #fileInput
      (change)="onFileSelected($event)"
      style="display: none"
    />
  </form>
</div>
