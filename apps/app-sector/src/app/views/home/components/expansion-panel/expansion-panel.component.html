<div class="expansion-panel">
  <div class="row">
    <div class="col-12">
      <stc-apps-panels-container></stc-apps-panels-container>
    </div>
    @for (card of kpiDTOList(); track card) {
    <div class="col-lg-4 col-md-6 col-sm-12">
      <mat-expansion-panel
        (opened)="panelOpenState = true"
        (closed)="panelOpenState = false"
      >
        <mat-expansion-panel-header>
          <stc-apps-expansion-panel-header
            class="w-100"
            [projectHeader]="card.kpiName"
            [kpisCode]="card.kpiCode"
            [status]="card.kpiStatus"
            [function]="card.calculationFunction"
            [direction]="card.direction"
          ></stc-apps-expansion-panel-header>
        </mat-expansion-panel-header>

        <stc-apps-expansion-panel-body
          class="mt-lg-0 mt-md-5"
          [percentage]="card.score"
          [kpiCode]="card.kpiCode"
        ></stc-apps-expansion-panel-body>
      </mat-expansion-panel>
    </div>
    }
  </div>
</div>
