<div class="score-card-tabs py-4">
  <stc-apps-tabs
    ngDefaultControl
    (changeSelectValue)="handleChangeTab($event); getSectorKpisDetails()"
  >
    @for (score of scores; track score) {
    <stc-apps-tab [value]="score?.scorecardTitle">{{
      score?.scorecardTitle
    }}</stc-apps-tab>
    }
  </stc-apps-tabs>
</div>

@if (selectedTab()) {
<stc-apps-expansion-panel [kpiDTOList]="kpiDTOList"></stc-apps-expansion-panel>
}
