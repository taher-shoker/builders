<section>
  <div class="row m-0 p-0">
    @for(department of departments; track $index) {
    <div class="col-md-6">
      <div class="card-holder">
        <div class="header-container d-flex justify-content-between">
          <h5>{{ department.departmentHeader }}</h5>
          <img src="assets/images/brand/growth-curve.svg" alt="" />
        </div>
        <div class="res-we-container d-flex justify-content-around">
          <div class="res-container">
            <div class="res-content d-flex justify-content-between">
              <p class="res-p">Result</p>
              <div class="res-value">{{ department.departmentResult }}%</div>
            </div>
          </div>
          <div class="we-container">
            <div class="we-content d-flex justify-content-between">
              <p class="we-p">Weight</p>
              <div class="we-value">{{ department.departmentWeight }}%</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</section>
