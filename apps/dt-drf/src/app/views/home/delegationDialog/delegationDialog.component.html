<div class="dialog p-4">
  <div class="dialog-body">
    <div class="dialog-header">Delegate a User</div>
    <div class="body-holder">
      <form [formGroup]="form">
        <div class="my-2">
          <stc-apps-input-full-width
            [label]="'Pick user'"
            [type]="'text'"
            formControlName="user"
          ></stc-apps-input-full-width>
        </div>
      </form>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="actions-wrapper">
      <button type="button" class="btn gray-outline" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="btn primary"
        (click)="update()"
        [disabled]="form.invalid"
      >
        Delegate
      </button>
    </div>
  </div>
</div>
