<div class="dialog p-4">
  <div class="dialog-body">
    <div class="dialog-header">Delegate a User</div>
    <div class="body-holder">
      <form [formGroup]="form">
        <div class="my-2">
          <stc-apps-select-drop-down [Resetting]="true" [label]="'Pick User'" [options]="users" [searchMode]="true"
            formControlName="user" [outputValue]="'email'"></stc-apps-select-drop-down>

        </div>
      </form>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="actions-wrapper">
      <button type="button" class="btn gray-outline" (click)="cancel()">
        Cancel
      </button>
      <button type="button" class="btn primary" (click)="update()" [disabled]="form.invalid">
        Save
      </button>
    </div>
  </div>
</div>
