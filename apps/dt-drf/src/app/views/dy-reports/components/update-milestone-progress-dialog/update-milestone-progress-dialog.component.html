<div class="dialog p-4">
  <div class="dialog-body">
    <div class="dialog-header">
      <p class="caption">
        {{ dialogCaption() }}
      </p>
      <p class="hint">
        {{ hint() }}
      </p>
    </div>
    <div class="body-holder">
      
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="actions-wrapper">
      <div>
        <button type="button" class="btn gray-outline" (click)="cancel()">
          Cancel
        </button>
      </div>
      <div>
        @if (showNoNeed) {
        <button
          type="button"
          class="btn primary"
          (click)="update()"
          [disabled]="!form.invalid"
        >
          No Need
        </button>
        }
        <button
          type="button"
          class="btn primary"
          (click)="update()"
          [disabled]="form.invalid || isLoading"
        >
          {{ data.type }}
        </button>
      </div>
    </div>
  </div>
</div>
