<div class="white-box">
  <div class="row">
    <div class="col-md-6">
      <h3>All Reports</h3>
    </div>
    <div class="col-md-6">
      <div class="row">
        <div class="col-md-4">
          <stc-apps-select-drop-down formControlName="category" [label]="''" [matLabel]="'Category'"
            [options]="categories()"></stc-apps-select-drop-down>
        </div>
        <div class="col-md-4">
          <stc-apps-select-drop-down formControlName="schedulingType" [matLabel]="'Report Status'" [label]="''"
            [options]="authService.reportStatus"></stc-apps-select-drop-down>
        </div>
        <div class="col-md-4">
          <stc-apps-select-drop-down formControlName="schedulingType" [label]="''"
            [options]="[]"></stc-apps-select-drop-down>
        </div>
      </div>
    </div>
  </div>
</div>
