<div class="dialog p-4">
  <div class="dialog-body">
    <div class="dialog-header">
      {{
        data.state === 'add'
          ? 'Create a Category'
          : 'Edit ' + data.category?.name
      }}
    </div>
    <div class="body-holder">
      <form [formGroup]="form">
        <div class="row my-2">
          <div class="col">
            <stc-apps-input
              [className]="'custom-input'"
              [inputPlaceholder]="'Enter Category Name'"
              [inputId]="'name'"
              [inputName]="'Category name'"
              formControlName="name"
            ></stc-apps-input>
          </div>
          <div class="col">
            <stc-apps-select-drop-down
              [label]="'SLA'"
              [options]="customRangeSLA"
              [outputValue]="'id'"
              [required]="true"
              formControlName="slaDuration"
            ></stc-apps-select-drop-down>
          </div>
        </div>
      </form>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="actions-wrapper">
      <button type="button" class="btn gray-outline" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="btn primary"
        (click)="save()"
        [disabled]="form.invalid"
      >
        {{ data.state === 'add' ? 'Create' : 'Edit' }}
      </button>
    </div>
  </div>
</div>
