<div class="dialog p-4">
  <div class="dialog-body">
    <div class="dialog-header">
      {{ data.state === 'add' ? 'Create a Category' : 'Edit ' + data.category.categoryName }}
    </div>
    <div class="body-holder">
      <form [formGroup]="form">
        <div class="row my-2">
          <div class="col">
            <stc-apps-input-full-width
              [label]="'Category name'"
              [type]="'text'"
              formControlName="name"
            ></stc-apps-input-full-width>
          </div>
          <div class="col">
            <stc-apps-input-full-width
              [label]="'SLA'"
              [type]="'text'"
              formControlName="sla"
            ></stc-apps-input-full-width>
          </div>
        </div>
      </form>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="actions-wrapper">
      <button type="button" class="btn gray-outline" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="btn primary"
        (click)="update()"
        [disabled]="form.invalid"
      >
        {{ data.state === 'add' ? 'Create' : 'Edit' }}
      </button>
    </div>
  </div>
</div>
