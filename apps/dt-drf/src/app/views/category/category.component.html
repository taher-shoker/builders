<div class="layout">
  <div class="box">
    <div class="row mt-4">
      <div class="offset-md-1 col-md-10">
        <div class="f-box">
          <div class="row align-items-center">
            <div class="col-md-12">
              <div class="row">
                <div class="col-6">
                  <h3>Categories List</h3>
                </div>
                <div class="offset-md-2 col-4">
                  <stc-apps-button [buttonText]="'Add New Category'" [buttonType]="'primary'"
                    [buttonIcon]="'fa-plus-circle'" (btnClick)="addNewCategory()"></stc-apps-button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            @if(tableData){
            <stc-apps-custom-table [items]="tableData" [headers]="columnsSchema" [length]="categoriesTotalCount"
              (doAction)="tableAction($event)" [applyFilter]="true">
            </stc-apps-custom-table>
            <ng-template #customTemplate let-header="header" let-item="item">
              <p class="custom-class-template">{{ item[header.key] }}</p>
            </ng-template>

            }
          </div>
        </div>
      </div>
      <div class="col-md-4"></div>
    </div>
  </div>
</div>
