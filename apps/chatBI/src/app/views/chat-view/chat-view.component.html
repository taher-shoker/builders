<div class="chat-view">
  <stc-apps-header [title]="'ChatBI'"></stc-apps-header>
  <div class="chat-view_messages-container">
    <div class="background"></div>
    <stc-apps-chat-list-item></stc-apps-chat-list-item>
    <stc-apps-chat-list-item [messageType]="1"></stc-apps-chat-list-item>
    <!-- <stc-apps-chat-list-item
      [messageType]="0"
      [message]="message"
    ></stc-apps-chat-list-item> -->
  </div>

  <div
    class="chat-view_input-container"
    [ngClass]="{ focused: isFocused, error: newMessage.length > 512 }"
  >
    <textarea
      class="textarea"
      [(ngModel)]="newMessage"
      placeholder="Ask me anything..."
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
    </textarea>

    <div class="text-area-actions">
      <div
        class="textarea-counter"
        [ngClass]="{ 'error-text': newMessage.length > 512 }"
      >
        <p>{{ newMessage.length }} / {{ maxLength }}</p>
      </div>
    </div>
    <div class="button-container">
      <img
        [ngClass]="{ disabled: newMessage.length > 512 || !newMessage.trim()}"
        src="assets/images/Vector.svg"
        alt=""
      />
    </div>
  </div>
</div>
