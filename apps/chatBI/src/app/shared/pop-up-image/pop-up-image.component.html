<div class="popup-overlay">
  <div class="popup-content" (click)="$event.stopPropagation()">
    <button #close class="close-btn" (click)="closeImagePopup()">
      <i class="fas fa-times"></i>
    </button>
    <div class="w-100">
      <stc-apps-chart-controller
        [sqlData]="chartData()"
        [showType]="chartType()"
        [popUpClick]="popUpClick"
      ></stc-apps-chart-controller>
    </div>
  </div>
</div>
