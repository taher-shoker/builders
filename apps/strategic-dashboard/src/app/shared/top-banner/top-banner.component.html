<stc-apps-header
  [userName]="userName"
  [logoSrc]="logoSrc"
  [allItems]="navItems"
  [sidebarLogoSrc]="sidebarLogoSrc"
  (logOut)="logOut()"
  (backToHome)="backToHome()"
  [showLang]="false"
></stc-apps-header>

<div class="banner row row-gap-3">
  <div class="banner_background_large"></div>
  <div class="banner_background_small"></div>
  <div class="col-md-10 col-sm-12">
    <div class="banner_content">
      <h2>Strategic Performance Report</h2>
      <p>
        Provide overview of strategic KPIs and tracks progress on DARE strategy
      </p>
    </div>
  </div>

  <div class="col-md-2 col-sm-12">
    <div class="banner_filter">
      <stc-apps-select-drop-down
        formControlName="dateType"
        [label]="'Select FY Year'"
        [options]="yearsArray"
        [outputValue]="'name'"
      ></stc-apps-select-drop-down>
    </div>
  </div>
</div>
