<div [formGroup]="form">
  <div class="filters-holder d-flex">
    <stc-apps-select-drop-down
      class="yearHolder"
      formControlName="year"
      [label]="'Select FY Year'"
      [(ngModel)]="year"
      [options]="yearsArray"
      [outputValue]="'name'"
      (selectChange)="selectYear($event)"
    ></stc-apps-select-drop-down>
    <stc-apps-select-drop-down
      formControlName="quarter"
      [label]="'Select quarter'"
      [(ngModel)]="quarter"
      [options]="quarterArray"
      [outputValue]="'name'"
      (selectChange)="selectQuarter($event)"
    ></stc-apps-select-drop-down>
  </div>
</div>
