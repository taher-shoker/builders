<div class="table-holder">
  <table
    mat-table
    [dataSource]="dataSource?.data.length > 0 ? dataSource : emptyData"
  >
    <ng-container matColumnDef="jobId">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">{{ element.jobId }}</td>
    </ng-container>

    <ng-container matColumnDef="executedBy">
      <th mat-header-cell *matHeaderCellDef>Excuted By</th>
      <td mat-cell *matCellDef="let element">{{ element.executedBy }}</td>
    </ng-container>

    <ng-container matColumnDef="originalFileName">
      <th mat-header-cell *matHeaderCellDef>Original FileName</th>
      <td mat-cell *matCellDef="let element">
        {{ element.originalFileName }}
      </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>status</th>
      <td mat-cell *matCellDef="let element">
        <div
          class="status-container"
          [class]="element.status === 'Success' ? 'success' : 'failure'"
        >
          {{ element.status }}
        </div>
      </td>
    </ng-container>
    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef>Start Time</th>
      <td mat-cell *matCellDef="let element">{{ element.startTime }}</td>
    </ng-container>
    <ng-container matColumnDef="endTime">
      <th mat-header-cell *matHeaderCellDef>End Time</th>
      <td mat-cell *matCellDef="let element">{{ element.endTime }}</td>
    </ng-container>

    <ng-container matColumnDef="empty-row">
      <mat-cell *matCellDef="let element" class="empty-message">
        No data found. Please check back later.
      </mat-cell>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <!-- <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr> -->
    <tr
      mat-row
      *matRowDef="
        let row;
        columns: dataSource?.data.length > 0 ? displayedColumns : ['empty-row']
      "
    ></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    pageSize="5"
    aria-label="Select page of periodic elements"
  >
  </mat-paginator>
</div>
