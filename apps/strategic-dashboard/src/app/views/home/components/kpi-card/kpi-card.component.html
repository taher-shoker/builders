<div class="kpi-card">
  <div class="kpi-card_content-holder">
    @for(cardDetail of cardDetails();track $index){
    <div
      [class]="$index === cardDetails().length - 1 ? '' : 'content-border'"
      class="kpi-card_content"
    >
      {{ cardDetail }}
    </div>
    }
  </div>
  <div class="kpi-card_footer">
    <div class="kpi-card_footer-content">
      More details
      <img src="assets/images/arrow-right.svg" alt="" />
    </div>
  </div>
</div>
