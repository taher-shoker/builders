<div class="home-page">
  <stc-apps-top-banner></stc-apps-top-banner>
  <div class="home-page_cardHolder row">
    @for(kpi of kpis;track $index){
    <div class="kpis-card col-md-6 col-lg-4 col-xl-3">
      <stc-apps-kpi-card-header
        class="kpis-card_header position-relative"
        [kpiTitle]="kpi.title"
        [iconPath]="kpi.iconPath"
      ></stc-apps-kpi-card-header>
      <stc-apps-kpi-card class="kpis-card_body" [cardDetails]="kpi.details">
      </stc-apps-kpi-card>
    </div>
    }
  </div>
  <div class="home-page_footer d-flex justify-content-between">
    <img src="assets/images/Rectangle.svg" alt="" />
    <img class="inverted" src="assets/images/Rectangle.svg" alt="" />
  </div>
</div>
