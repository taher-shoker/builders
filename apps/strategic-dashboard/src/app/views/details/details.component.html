<div class="details-page">
  <div class="details-page_title">
    <h3>{{ titleData }}</h3>
    <div class="filter">
      <p>Select FY Year</p>
      <stc-apps-select-drop-down
        [label]="''"
        [options]="yearsArray"
        [outputValue]="'name'"
      ></stc-apps-select-drop-down>
    </div>
  </div>
  <div class="details-page_progressHolder">
    @for(progress of progressInfo; track progress; let index=$index){
    <div class="details-page_progress-overview">
     <stc-apps-progress-percentage [percentage]="progress.percantage"></stc-apps-progress-percentage>
      <p>{{ progress.progressDesc }}</p>
    </div>
    }
  </div>

  <div class="details-page_cards row row-gap-3">
    @for (cardInfo of cardsInfo; track $index) {
    <div class="col-xl-2 col-md-4 col-sm-6 col-xs-12">
      <stc-apps-progress-card
        [title]="cardInfo.title"
        [precentage]="cardInfo.percentage"
        [status]="cardInfo.status"
      ></stc-apps-progress-card>
    </div>
    }
  </div>
</div>
<div class="details-page_range">
  <div class="range-title">Range Historical Trend</div>
  <div>
    <div class="range-holder col-md-12 col-lg-12 col-xl-6">
      <stc-apps-range-slider
        [startValue]="200"
        [endValue]="750"
      ></stc-apps-range-slider>
    </div>
  </div>
</div>
<div class="details-page_charts row row-gap-3">
  @for (item of cardsInfo; track $index) {
  <div class="details-page_charts_item col-lg-6 col-md-12 col-sm-12">
    <stc-apps-chart-card [title]="item.title"></stc-apps-chart-card>
  </div>
  }
</div>
