  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
      <th mat-header-cell *matHeaderCellDef>
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element">
        <div [ngSwitch]="col.key">
          <div class="info-name" *ngSwitchCase="'name'">
            <img src="{{ element.profileIcon }}" alt="" />
            <div class="name">
              <h4>{{ element[col.key] }}</h4>
              <small>{{ element.email }}</small>
            </div>
          </div>
          <div class="btns-action" *ngSwitchCase="'actions'">
            <button mat-button class="btn edit-btn-table">
              <i class="fas fa-pencil-alt"></i>
            </button>
            <button mat-button class="btn delete-btn-table">
              <i class="far fa-trash-alt"></i>
            </button>
          </div>
          <span class="cell-text" *ngSwitchDefault>
            {{ element[col.key] }}
          </span>
        </div>
      </td>
    </ng-container>
