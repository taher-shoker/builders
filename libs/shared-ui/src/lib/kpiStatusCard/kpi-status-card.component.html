<div
  [class.achieved]="kpiStatus() === 1"
  [class.not-achieved]="isString"
  [class.actual]="isNumber"
>
  @if(kpiStatus() === 1){
    Over Achieved
    <img class="arrow" src="assets/images/arrow-up-solid.svg" />
  }
  @if(isString){
    {{kpiStatus()}}
  }
  @if(isNumber){
    Actual : {{kpiStatus()}}%
  }
</div>
