<div class="project-card mt-4">
  <div class="project-card-header">
    <p class = "project-card-header-title">{{projectData().title}}</p>
    <button class = "show-menu-btn" [matMenuTriggerFor]="menu">
      <i class="pi pi-ellipsis-v"></i>
      <!-- <mat-icon >more_vert</mat-icon> -->
    </button>
    <mat-menu #menu="matMenu" class = "edit-delete-project">
      <button mat-menu-item>
        <img src="assets/images/edit-project.svg" alt="">
        <span>edit</span>
      </button>
      <button mat-menu-item>
        <img src="assets/images/delete-project.svg" alt="">
        <span>delete</span>
      </button>
    </mat-menu>
  </div>
  <div>
    <div class="project-card-bar">
      <stc-apps-progress-bar
        [data]="data"
        [isProject]="true"
        [fontFamily]="'STCForwardFont'"
      />
    </div>
  </div>
</div>
