<div class="progress-bar-holder">
  @if (data().prefixText){
  <div class="bar-prefix">
    <p class="title">{{ data().prefixText }}</p>
    <p class="value">{{ data().prefixValue }}{{ unit }}</p>
  </div>
  }
  <div class="bars-holder">
    <div
      class="background-bar"
      [ngStyle]="{ 'background-color': data().bgBarColor }"
    >
      <div
        class="bar"
        [ngStyle]="{
          width: data().progressValue + unit,
          'background-color': data().barColor
        }"
      ></div>
      <div class="invisible-bar">
        @for (index of data().indexes; track index) {
        <div
          class="indexer"
          [ngStyle]="{
            left: index.value + unit,
            top: index.position === 'up' ? '-85px' : null,
            bottom: index.position === 'down' ? '-65px' : null
          }"
        >
          <div
            class="holder"
            [ngStyle]="{
              'padding-top': index.position === 'down' ? '12px' : null,
              'padding-bottom': index.position === 'up' ? '12px' : ''
            }"
          >
            <span class="index-info caption">{{ index.caption }}</span
            ><br />
            <span class="index-info value">{{ index.value }}{{ unit }}</span>
            <span
              class="index-info pointer"
              [ngStyle]="{
                top: index.position === 'down' ? '0' : '',
                bottom: index.position === 'up' ? '0' : '',
                
              }"
            ></span>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
  @if (data().suffixText){

  <div class="bar-suffix">
    <p class="title">{{ data().suffixText }}</p>
    <p class="value">{{ data().suffixValue }}{{ unit }}</p>
  </div>
  }
</div>
