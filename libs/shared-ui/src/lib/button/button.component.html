<button type="button" class="btn" [class]="buttonType" [ngStyle]="{ opacity: buttonDisable ? '0.3' : '' }"
  [disabled]="buttonDisable || loading" (click)="onClick()">
  {{ buttonText | translate }}
  <i class="fas {{ buttonIcon }}" *ngIf="buttonIcon"></i>
  <span class="loader" *ngIf="loading"></span>

</button>
