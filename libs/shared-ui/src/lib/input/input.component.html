<div class="input-group stc-input-group mb-3">
  <span class="input-group-text" id="basic-addon1" *ngIf="inputIcon"
    ><i class="fas {{ inputIcon }}"></i
  ></span>
  <input
    class="form-control stc-input"
    [type]="inputType"
    [id]="inputName"
    [name]="inputName"
    [placeholder]="inputPlaceholder ? inputPlaceholder : ''"
    autocomplete="off"
  />
</div>
