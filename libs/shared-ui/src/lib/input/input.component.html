<div class="input-group stc-input-group" *ngIf="control">
  <label
    >{{ inputName }}
    <mat-error *ngIf="control.hasError('required')">* </mat-error></label
  >
  <mat-form-field class="">
    <span class="input-group-text" id="basic-addon1" *ngIf="inputIcon"
      ><i class="fas {{ inputIcon }}"></i
    ></span>
    <input
      [type]="inputType"
      [id]="inputId"
      [name]="inputName"
      matInput
      [placeholder]="inputPlaceholder ? inputPlaceholder : ''"
      autocomplete="off"
      [formControl]="control"
    />
    <mat-error *ngIf="control.hasError('required')"
      >{{"field_required" | translate}}
    </mat-error>
  </mat-form-field>
</div>
