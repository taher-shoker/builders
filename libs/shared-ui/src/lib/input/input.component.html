<div class="input-group stc-input-group">
  <label>{{ inputName }} <mat-error>* </mat-error></label>
  <mat-form-field class="">
    <span class="input-group-text" id="basic-addon1" *ngIf="inputIcon"
      ><i class="fas {{ inputIcon }}"></i
    ></span>
    <input
      [type]="inputType"
      [id]="inputId"
      [name]="inputName"
      matInput
      [placeholder]="inputPlaceholder ? inputPlaceholder : ''"
      (blur)="onInputBlur($event)"
      autocomplete="off"
    />
    <mat-error>This Field Is Required </mat-error>
  </mat-form-field>
</div>
