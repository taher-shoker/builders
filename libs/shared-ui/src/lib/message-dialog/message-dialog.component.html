<div class="dialog ">
  <div class="dialog-body">
    <div class="body-holder">
      <p>{{ message }}</p>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <button type="button" class="btn gray-outline" (click)="cancel()">Close</button>
    <button type="button" class="btn primary" (click)="approve()">Yes</button>

  </div>
</div>
