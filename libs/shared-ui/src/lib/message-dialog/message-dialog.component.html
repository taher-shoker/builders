<div class="dialog">
  <div class="dialog-body">
    <div class="body-holder">
      <p>{{ message }}</p>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions">
    <div class="d-flex">
      <button type="button" class="btn" (click)="approve()">Yes</button>
      <button type="button" class="btn" (click)="cancel()">Close</button>
    </div>
  </div>
</div>
