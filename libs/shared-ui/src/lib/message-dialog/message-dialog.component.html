<div class="dialog ">
  <div class="dialog-body">
    <div class="body-holder">
      <p>{{ message }}</p>
    </div>
  </div>

  <hr class="liner-hr" />

  <div class="dialog-actions row">
    <div class="col-md-3"><stc-apps-button [buttonText]="'Close'" [buttonType]="'gray-outline'"
        (btnClick)="cancel()"></stc-apps-button></div>
    <div class="col-md-3"><stc-apps-button [buttonText]="'Yes'" [buttonType]="'primary'" (btnClick)="approve()"
        [actionType]="'submit'"></stc-apps-button></div>


  </div>
</div>
