<div class="select-box" [class]="selectType" *ngIf="control">
  <label
    >{{ label }}<span>:</span
    ><mat-error *ngIf="control.errors"> *</mat-error></label
  >
  <mat-form-field>
    <mat-select
      [formControl]="control"
      [id]="selectId"
      [required]="required"
      (selectionChange)="onChangeValue($event.value)"
    >
      <mat-option *ngFor="let option of options" [value]="option.value">
        {{ option.name | translate}}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="control.errors">{{"field_required" | translate}}</mat-error>
  </mat-form-field>
</div>
