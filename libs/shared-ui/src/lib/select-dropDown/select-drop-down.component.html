<div class="select-box" [class]="selectType">
  <label
    >{{ label }}<span>:</span
    ><mat-error *ngIf="optionsControl.hasError('required')">
      *</mat-error
    ></label
  >
  <mat-form-field>
    <mat-select
      [formControl]="optionsControl"
      required="{{ required }}"
      (blur)="onInputBlur($event)"
    >
      <mat-option *ngFor="let option of options" [value]="option">
        {{ option.name }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="optionsControl.hasError('required')"
      >This Field Is Required
    </mat-error>
  </mat-form-field>
</div>
