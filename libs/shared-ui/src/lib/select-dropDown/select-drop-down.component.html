<div class="select-box" [class]="selectType" *ngIf="control">
  <label [ngStyle]="{'font-size': labelSize + 'px'}">{{ label | translate }}<span>:</span><mat-error
      *ngIf="control.errors"> *</mat-error></label>
  <mat-form-field *ngIf="!group">
    <mat-select [formControl]="control" [required]="required" (selectionChange)="onChangeValue($event.value)"
      [(value)]="defaultAll ? options ? options[0] : '' : selectId" [multiple]="multi">
      <mat-option *ngFor="let option of options" [value]="multi ? option[labelValue]: option">
        {{ option[labelName] }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="control.errors">{{
      'field_required' | translate
      }}</mat-error>
  </mat-form-field>
  <mat-form-field *ngIf="group">
    <mat-select [formControl]="control" [multiple]="multi" [(value)]="selectId"
      (selectionChange)="onChangeValue($event.value)">
      <mat-optgroup *ngFor="let group of options" [label]="group[groupName]" [disabled]="group.disabled">
        <mat-option *ngFor="let option of group[groupOptions]" [value]="option.id">
          {{option[labelName]}}
        </mat-option>
      </mat-optgroup>
    </mat-select>
    <mat-error *ngIf="control.errors">{{
      'field_required' | translate
      }}</mat-error>
  </mat-form-field>
  <div style="display: none" *ngIf="!yet">
    <ng-content></ng-content>
  </div>
</div>
