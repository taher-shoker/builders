<div class = "overlay-container" style = "position:relative;" #overlay>
  <p-overlayPanel 
  #activityLogsPanel 
  dismissable="false"
  [appendTo]="(isActionPopup() || isActionPopup2()) ? overlay : 'body'"
  styleClass="activity-logs-panel"
  [styleClass]="isActionPopup() ? 'action-Popup' : isActionPopup2() ? 'action-Popup2' : ''"
>
    <div class="activity-logs-table" [class.projectActionPopup]="isProjectActionPopup()">
      <div class="activity-logs-table-header">
        <p>activity logs</p>
        <i
            class="pi pi-times-circle"
            (click)="closeActivityLogsPopup()"
            style="margin-right: 1px"
          ></i>
      </div>
      <div class = "table-container">
        <stc-apps-custom-table
        [headers]="activityLogsTableHeader()"
        [items]="activityLogsTableBody()"
        [psrTable]="true"
        [fontFamily]="'STCForwardFont'"
        [activityLogTable]="true"
        (addRecord)="gotoActivityLogs()"
      />
      </div>
    </div>
  </p-overlayPanel>
</div>
