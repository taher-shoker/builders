<div class="pending-tasks">
  <p class="main-title">
    <i [class]="iconClass || 'far fa-clock'"></i> {{ caption }}
  </p>
  <ul class="tasks">
    <li class="mt-3" *ngFor="let item of items">
      <div class="task" (click)="clickItem(item.externalSystemId)">
        <div class="task-header">
          <div class="row">
            <div class="col left-col">
              Milestone ID: <strong>#{{ item.externalSystemId }}</strong>
            </div>
            <div class="col right-col">
              {{ item.createdDate | date : 'medium' }}
            </div>
          </div>
        </div>
        <div class="task-desc-holder">
          <p class="task-desc">
            "The milestones that you updated have been reviewed and are complete.<strong>{{ item.taskName}}</strong> "
          </p>
        </div>
      </div>
    </li>
  </ul>
</div>
