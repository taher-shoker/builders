<p-tabView [(activeIndex)]="activeIndex" [scrollable]="true" #tabsView [styleClass]="isMobile() ? 'mobile-view' : 'not-mobile-view'">
  <p-tabPanel>
    <ng-template pTemplate="header">
      <div *ngFor="let tab of tabsData(); let index = index">
      <!-- <div *ngFor="let tab of tabsData(); let index = index"> -->
        <div
          [class.clickedTap]="currentClickedTapIndex === index"
          (click)="toggleTaps(index, tab.name , tab)"
          (mouseenter)="onHover = true;hoveredTap = index"
          (mouseleave)="onHover = false"
          [ngStyle]="{
            color:
              currentClickedTapIndex === index ||
              (onHover && hoveredTap === index)
                ? clickedtabColor()
                : tabColor(),
            background:
              currentClickedTapIndex === index ||
              (onHover && hoveredTap === index)
                ? clickedtabBackground()
                : tabBackground(),
            'font-family': fontFamily() ? fontFamily() : 'Poppins'
          }"
          class="tap"
          [class.ActivityLogTable]="isActivityLogTable()"
        >
          {{ tab.name }}
        </div>
      </div>
    </ng-template>
  </p-tabPanel>
</p-tabView>
