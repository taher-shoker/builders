<div class="input-group stc-input-group" *ngIf="control">
  <label
    >{{ inputName }} <mat-error *ngIf="control.errors">* </mat-error></label
  >
  <mat-form-field class="">
    <textarea
      matInput
      rows="5"
      [id]="inputId"
      [name]="inputName"
      [placeholder]="inputPlaceholder ? inputPlaceholder : ''"
      [formControl]="control"
    ></textarea>
    <mat-error *ngIf="control.errors">This Field Is Required </mat-error>
  </mat-form-field>
</div>
